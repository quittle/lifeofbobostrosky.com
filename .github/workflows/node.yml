on: [push, pull_request]

concurrency:
  group: deploy
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Full Build
        run: |
          npm ci
          echo "=== DIAG2 ==="
          ls node_modules/@babel/node/lib/babel-node.js && echo "EXISTS-after-ci"
          ls -la node_modules/.bin/babel-node
          readlink -f node_modules/.bin/babel-node || true
          echo "--- trivial npm run ---"
          time npm run --silent env > /dev/null && echo "npm-run-env ok"
          ls node_modules/@babel/node/lib/babel-node.js && echo "EXISTS-after-trivial-run" || echo "GONE-after-trivial-run"
          echo "--- direct binary, bypassing npm run ---"
          time node_modules/.bin/babel-node --version || echo "direct babel-node failed: $?"
          ls node_modules/@babel/node/lib/babel-node.js && echo "EXISTS-after-direct" || echo "GONE-after-direct"
          echo "=== END DIAG2 ==="
          npm run build-and-test
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
        run: npm run release
