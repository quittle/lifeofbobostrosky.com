on: [push, pull_request]

concurrency:
  group: deploy
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Full Build
        run: |
          npm ci
          echo "=== DIAGNOSTIC: babel install state ==="
          node --version; npm --version
          ls -la node_modules/@babel/ 2>&1 || echo "NO @babel dir"
          ls -la node_modules/@babel/node/ 2>&1 || echo "NO @babel/node dir"
          ls -la node_modules/@babel/node/lib/ 2>&1 || echo "NO lib dir"
          npm ls @babel/node 2>&1 || true
          echo "=== END DIAGNOSTIC ==="
          npm run build-and-test
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
        run: npm run release
